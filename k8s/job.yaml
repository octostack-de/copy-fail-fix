apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: copy-fail-mitigation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeName: ${NODE_NAME}
      hostPID: true
      tolerations:
      - operator: Exists
      containers:
      - name: mitigate
        image: alpine:3.20
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-modprobe-d
          mountPath: /host/etc/modprobe.d
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          apk add --no-cache util-linux kmod >/dev/null

          cat > /host/etc/modprobe.d/disable-af_alg.conf <<'EOF'
          # CVE-2026-31431 (copy.fail) mitigation
          install algif_aead /bin/false
          install algif_hash /bin/false
          install algif_skcipher /bin/false
          install algif_rng /bin/false
          install af_alg /bin/false
          EOF

          for mod in algif_aead algif_hash algif_skcipher algif_rng af_alg; do
            if ! err=$(nsenter -t 1 -a -- modprobe -r "$mod" 2>&1); then
              echo "modprobe -r $mod failed: $err" >&2
            fi
          done

          # algif_aead is the CVE; tolerate residue from other family modules
          # since the modprobe block prevents algif_aead from reloading.
          aead_loaded=$(nsenter -t 1 -a -- lsmod | awk '$1 == "algif_aead"')
          conf=/host/etc/modprobe.d/disable-af_alg.conf
          if [ -n "$aead_loaded" ]; then
            echo "FAIL: algif_aead still loaded on $(hostname)" >&2
            nsenter -t 1 -a -- lsmod | awk 'NR==1 || /^(algif_|af_alg)/' >&2
            exit 1
          fi
          if ! grep -q '^install algif_aead /bin/false' "$conf" 2>/dev/null; then
            echo "FAIL: $conf missing install line for algif_aead" >&2
            exit 1
          fi

          residue=$(nsenter -t 1 -a -- lsmod | awk '/^(algif_|af_alg)/ {print $1}' | tr '\n' ' ')
          if [ -n "$residue" ]; then
            echo "WARN: family modules still loaded (CVE module unloaded; modprobe block in place): $residue"
            nsenter -t 1 -a -- lsmod | awk 'NR==1 || /^(algif_|af_alg)/'
          fi
          echo "OK: algif_aead unloaded and blocked on $(hostname)"
      volumes:
      - name: host-modprobe-d
        hostPath:
          path: /etc/modprobe.d
          type: Directory
